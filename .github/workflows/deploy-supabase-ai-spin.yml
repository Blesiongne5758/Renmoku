name: Deploy Supabase AI Spin

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-supabase-ai-spin.yml'
  workflow_dispatch:

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Verify deployment configuration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          : "${SUPABASE_ACCESS_TOKEN:?Add the GitHub Actions secret SUPABASE_ACCESS_TOKEN}"
          : "${SUPABASE_PROJECT_REF:?Add the GitHub Actions secret SUPABASE_PROJECT_REF}"
      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          npx --yes supabase@latest functions deploy spin-catalog --project-ref "$SUPABASE_PROJECT_REF"
          npx --yes supabase@latest functions deploy spin-manual-order --project-ref "$SUPABASE_PROJECT_REF"
          npx --yes supabase@latest functions deploy spin-checkout --project-ref "$SUPABASE_PROJECT_REF"
          npx --yes supabase@latest functions deploy spin-model-generate --project-ref "$SUPABASE_PROJECT_REF"
          npx --yes supabase@latest functions deploy spin-model-sync --project-ref "$SUPABASE_PROJECT_REF"
          npx --yes supabase@latest functions deploy spin-model-publish --project-ref "$SUPABASE_PROJECT_REF"
          npx --yes supabase@latest functions deploy spin-payment-webhook --project-ref "$SUPABASE_PROJECT_REF"
          npx --yes supabase@latest functions deploy spin-renewal-webhook --project-ref "$SUPABASE_PROJECT_REF"
          npx --yes supabase@latest functions deploy spin-payment-reconcile --project-ref "$SUPABASE_PROJECT_REF"
